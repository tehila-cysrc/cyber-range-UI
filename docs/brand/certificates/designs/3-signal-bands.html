<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Certificate — Signal Bands</title>
<link rel="stylesheet" href="base.css">
<!-- Based on source/Green and Gold Modern Participation Certificate (gold → brand green, green → Eerie Black) -->
<style>
  body { background: #ffffff; color: var(--eerie); }
  .bg { inset: 0; width: 100%; height: 100%; }
  .center { left: 0; right: 0; text-align: center; }
  .title { top: 22mm; font-size: 58pt; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .ribbon { top: 48mm; left: 50%; transform: translateX(-50%); width: 112mm; height: 15mm; }
  .ribbon span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13pt; font-weight: 800; letter-spacing: 0.2em; }
  .lead { top: 76mm; font-size: 14pt; color: #3a454e; }
  .name { top: 88mm; font-size: 40pt; font-weight: 600; font-style: italic; color: var(--green); letter-spacing: -0.01em; }
  .rule { top: 117mm; left: 50%; width: 175mm; transform: translateX(-50%); height: 4mm; }
  .body { top: 124mm; left: 50%; width: 170mm; transform: translateX(-50%); text-align: center; font-size: 13.5pt; line-height: 1.6; color: #3a454e; }
  .sig { top: 160mm; width: 62mm; text-align: center; }
  .sig .val { font-size: 13pt; font-weight: 600; padding-bottom: 1.5mm; border-bottom: 1.4px solid var(--eerie); }
  .sig .key { margin-top: 2mm; font-size: 11pt; font-weight: 600; color: var(--green); }
  .sig-l { left: 62mm; } .sig-r { right: 62mm; }
  .logo { bottom: 7mm; left: 50%; transform: translateX(-50%); height: 9mm; }
</style>
</head>
<body>
<div class="page">
  <svg class="abs bg" viewBox="0 0 1123 794" preserveAspectRatio="none" aria-hidden="true">
    <g id="waves" fill="none" stroke="#d9e0dc" stroke-width="0.6"></g>
    <!-- top-right bands -->
    <polygon points="560,0 1123,0 1123,232" fill="#151c22"/>
    <polygon points="520,0 556,0 1123,236 1123,262" fill="#53b464"/>
    <polygon points="820,0 1123,0 1123,96" fill="#26313a"/>
    <polygon points="760,0 800,0 1123,104 1123,118" fill="#9fd6a9"/>
    <!-- top-left accent -->
    <polygon points="0,0 210,0 0,170" fill="#53b464"/>
    <polygon points="0,0 160,0 0,128" fill="#151c22"/>
    <!-- bottom-left bands -->
    <polygon points="0,610 0,794 430,794" fill="#151c22"/>
    <polygon points="0,580 0,604 440,794 400,794" fill="#53b464"/>
    <polygon points="0,700 0,794 230,794" fill="#26313a"/>
    <!-- bottom-right accent -->
    <polygon points="1123,794 1123,600 900,794" fill="#53b464"/>
    <polygon points="1123,794 1123,650 960,794" fill="#151c22"/>
  </svg>

  <div class="abs center title">Certificate</div>
  <div class="abs ribbon">
    <svg viewBox="0 0 424 57" width="100%" height="100%" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="0,0 424,0 398,28.5 424,57 0,57 26,28.5" fill="#53b464"/>
    </svg>
    <span>OF COMPLETION</span>
  </div>
  <div class="abs center lead">This certificate is proudly presented to</div>
  <div class="abs center name">Alex Morgan</div>
  <svg class="abs rule" viewBox="0 0 660 14" preserveAspectRatio="none" aria-hidden="true">
    <line x1="8" y1="7" x2="652" y2="7" stroke="#151c22" stroke-width="1.6"/>
    <rect x="3" y="3" width="8" height="8" transform="rotate(45 7 7)" fill="#151c22"/>
    <rect x="649" y="3" width="8" height="8" transform="rotate(45 653 7)" fill="#151c22"/>
  </svg>
  <p class="abs body">In recognition of participating in the company-sponsored SOC Training Day and successfully completing the Cyber Range scenario.</p>

  <div class="abs sig sig-l"><div class="val">Instructor Name</div><div class="key">signature</div></div>
  <div class="abs sig sig-r"><div class="val">07/10/2026</div><div class="key">date</div></div>

  <img class="abs logo" src="../../logo/logo-wordmark-black.svg" alt="CySource">
</div>
<script>
  // Fine flowing line field (the "wave" texture from the source), top-left and bottom-right.
  const g = document.getElementById('waves');
  const ns = 'http://www.w3.org/2000/svg';
  const add = d => { const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); g.appendChild(p); };
  for (let i = 0; i < 46; i++) {
    const k = i * 3.2;
    add(`M ${-20} ${420 - k} C ${120 + k} ${360 - k * 1.4}, ${80 + k * 1.2} ${120 - k}, ${300 + k * 1.5} ${-10}`);
    add(`M ${1143} ${380 + k} C ${1000 - k} ${450 + k * 1.3}, ${1060 - k * 1.2} ${690 + k * 0.6}, ${820 - k * 1.5} ${804}`);
  }
</script>
</body>
</html>
